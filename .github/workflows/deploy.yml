name: Deploy Claudia AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Hourly — keeps public/data/*.json and sitemap.xml in sync with
    # Supabase even when nothing was pushed to main (e.g. new projects
    # created directly through the app, not via a code change).
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Verify Repository
        run: |
          pwd
          ls -la
          ls -la scripts
          ls -la public
          ls -la public/data || true

      - name: Export Supabase Data
        run: node ./scripts/sync-data.mjs

      - name: Verify Export
        run: |
          echo "===== public/data ====="
          ls -lah public/data
          test -f public/data/projects.json
          test -f public/data/projects.json.gz
          test -f public/data/index.json

      - name: Build Project
        run: npm run build

      - name: Verify Dist
        run: |
          ls -lah dist
          ls -lah dist/data || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-edge-functions:
    runs-on: ubuntu-latest
    needs: build
    # Only on an actual code push or manual run — DB migrations and edge
    # function deploys aren't related to the hourly data/sitemap refresh,
    # so the schedule trigger skips this job entirely.
    if: github.event_name != 'schedule'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Repair Migration History
        # The remote project has a migration version (20260728083645) recorded
        # in its history table that has no matching file in
        # supabase/migrations/ (it was applied directly on the remote, e.g.
        # via the SQL editor, and never committed). `db push` refuses to run
        # until that's resolved. Marking it "reverted" just tells Supabase to
        # forget that bookkeeping entry — it does NOT undo any real schema
        # change already applied to the database. `|| true` makes this a
        # no-op on every future run once it's fixed once.
        run: supabase migration repair --status reverted 20260728083645 --db-url "$SUPABASE_DB_URL" || true

      - name: Apply Database Migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref dcjyoqhuzelsmtdqxosp
