name: Deploy Claudia AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Verify Repository
        run: |
          pwd
          ls -la
          ls -la scripts
          ls -la public
          ls -la public/data || true

      - name: Export Supabase Data
        run: node ./scripts/sync-data.mjs

      - name: Verify Export
        run: |
          echo "===== public/data ====="
          ls -lah public/data
          test -f public/data/projects.json
          test -f public/data/projects.json.gz
          test -f public/data/index.json

      - name: Build Project
        run: npm run build

      - name: Verify Dist
        run: |
          ls -lah dist
          ls -lah dist/data || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-edge-functions:
    runs-on: ubuntu-latest
    needs: build

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Repair Migration History
        run: supabase migration repair --status reverted 20260726121409 20260726153545 20260726155934 20260726155947 20260726160015 20260726160037 20260726162442 20260726162522 20260726194116 --db-url "$SUPABASE_DB_URL"

      - name: Apply Database Migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
