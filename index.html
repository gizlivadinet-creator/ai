    <script>
      // Reverses the redirect performed by public/404.html: if we were
      // bounced here from an unknown deep path (e.g. /p/my-project), swap
      // the URL back to the real, clean path *before* the app or any SEO
      // tags below read window.location, using replaceState so it never
      // shows up as an extra history entry.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>

    <div id="root"></div>

    <script>
      // Boot-error catcher: if anything throws before/while React mounts,
      // show the real error on screen instead of leaving a silent white
      // page. This does nothing once the app has mounted successfully.
      (function () {
        var shown = false;
        function showBootError(message) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return; // app already mounted
          shown = true;
          root.innerHTML =
            '<div style="font-family:monospace;background:#1a1a2e;color:#ff6b6b;' +
            'padding:24px;min-height:100vh;box-sizing:border-box;white-space:pre-wrap;' +
            'word-break:break-word;font-size:14px;line-height:1.6;">' +
            '<strong style="color:#fff;font-size:16px;">Sayfa yüklenirken bir hata oluştu:</strong>\n\n' +
            String(message) +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          showBootError((e && e.message) || e);
        });
        window.addEventListener('unhandledrejection', function (e) {
          showBootError((e && e.reason && (e.reason.message || e.reason)) || e);
        });
        // Fallback: if nothing has mounted into #root after 6s with no
        // error event fired either, say so explicitly (e.g. a script
        // failed to load at all, so no JS error ever ran).
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            showBootError(
              '6 saniye sonra hâlâ hiçbir şey yüklenmedi ve hata olayı da tetiklenmedi.\n' +
              'Bu genelde bir dosyanın (script/asset) hiç yüklenememesi anlamına gelir ' +
              '(404, yanlış yol, veya ağ engeli).'
            );
          }
        }, 6000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!--
      GTranslate (https://gtranslate.io/) website translator.
      The visible language switcher in the app header is custom-built and
      drives this widget programmatically (see src/lib/gtranslate.ts) via
      the standard `googtrans` cookie, so this default wrapper stays
      visually hidden (see .gtranslate_wrapper in index.css) — it only
      needs to exist in the DOM for the widget script to attach to and
      perform the actual translation.
    -->
    <div class="gtranslate_wrapper notranslate"></div>
    <script>
      window.gtranslateSettings = {
        default_language: 'tr',
        languages: ['tr', 'en'],
        wrapper_selector: '.gtranslate_wrapper',
        flag_style: '3d',
        alt_flags: {},
        switcher_horizontal_position: 'inline'
      };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
